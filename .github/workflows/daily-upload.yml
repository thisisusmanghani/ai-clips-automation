name: Daily Video Upload

on:
  schedule:
    # Run 3 times per day at optimal hours for US audience
    # 9 AM EST, 3 PM EST, 8 PM EST
    - cron: '0 14 * * *'  # 9 AM EST (14:00 UTC)
    - cron: '0 20 * * *'  # 3 PM EST (20:00 UTC)
    - cron: '0 1 * * *'   # 8 PM EST (01:00 UTC next day)
  workflow_dispatch:  # Manual trigger
    inputs:
      count:
        description: 'Number of videos to upload'
        required: false
        default: '1'
      category:
        description: 'Category (leave empty for random)'
        required: false
        default: ''
      shorts_only:
        description: 'Upload only Shorts'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install playwright python-dotenv google-api-python-client \
            google-auth-httplib2 google-auth-oauthlib gspread requests pytz
          playwright install chromium
      
      - name: Setup credentials
        run: |
          # Create .env file from secrets
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" > .env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
          echo "SPREADSHEET_ID=${{ secrets.SPREADSHEET_ID }}" >> .env
          echo "TIMEZONE=America/New_York" >> .env
          
          # Create OAuth token from secret
          mkdir -p automation
          echo "${{ secrets.OAUTH_TOKEN_PICKLE_B64 }}" | base64 -d > automation/token.json
          
          # Create client secrets file
          echo '${{ secrets.CLIENT_SECRETS_JSON }}' > client_secret.json
      
      - name: Download video data
        uses: actions/cache@v4
        with:
          path: |
            data/
            automation/uploaded_videos.json
          key: video-data-${{ github.run_number }}
          restore-keys: |
            video-data-
      
      - name: Run upload pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          # Determine upload parameters
          COUNT="${{ github.event.inputs.count || '1' }}"
          CATEGORY="${{ github.event.inputs.category || '' }}"
          SHORTS="${{ github.event.inputs.shorts_only || 'false' }}"
          
          # Add some randomness to the count (1-3 videos per run)
          if [ "$COUNT" == "1" ]; then
            COUNT=$((1 + RANDOM % 3))
          fi
          
          # Build command
          CMD="python automation/pipeline.py --count $COUNT"
          
          if [ -n "$CATEGORY" ]; then
            CMD="$CMD --category $CATEGORY"
          fi
          
          if [ "$SHORTS" == "true" ]; then
            CMD="$CMD --shorts"
          fi
          
          echo "Running: $CMD"
          $CMD
      
      - name: Update data cache
        uses: actions/cache/save@v4
        with:
          path: |
            data/
            automation/uploaded_videos.json
          key: video-data-${{ github.run_number }}
      
      - name: Commit tracking updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/uploaded_videos.json || true
          git add data/deduplication_log.json || true
          git diff --staged --quiet || git commit -m "Update upload tracking [skip ci]"
          git push || true
# Trigger workflow registration
